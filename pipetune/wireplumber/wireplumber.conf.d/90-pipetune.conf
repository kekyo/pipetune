# PipeTune transparent-filter policy for WirePlumber 0.5 and later.

wireplumber.profiles = {
  main = {
    pipetune.policy = required
  }
  policy = {
    pipetune.policy = required
  }
}

wireplumber.components = [
  {
    name = pipetune/policy-0.5.lua, type = script/lua
    provides = pipetune.policy
    requires = [ metadata.filters ]
  }
]
