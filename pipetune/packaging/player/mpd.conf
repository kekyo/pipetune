# Dedicated PipeTune receiver. upmpdcli connects locally on the same port.
bind_to_address "127.0.0.1"
port "16600"
state_file "~/.local/state/pipetune/player/mpd.state"
restore_paused "yes"

audio_output {
    type "pipewire"
    name "PipeTune"
    target "pipetune_sink"
    mixer_type "software"
}
